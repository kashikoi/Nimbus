<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nimbus</title>
  <meta name="theme-color" content="#7ec0ee" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Set theme class before first paint to prevent light-mode flash
    try {
      if (localStorage.getItem("nimbus.theme") === "dark") document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Ambient Scenic Background: Ocean, Nimbus Storm Clouds, Fog & Lighthouse with Glowing Beacon -->
  <div class="scenic-bg" aria-hidden="true">
    <!-- Sky Layer -->
    <div class="sky-backdrop">
      <div class="stars-layer">
        <div class="stars stars--sm"></div>
        <div class="stars stars--lg"></div>
      </div>
    </div>

    <!-- Nimbus Storm Clouds Layer (Multi-lobed Volumetric Formations) -->
    <div class="clouds-layer">
      <!-- Left Nimbus Formation -->
      <div class="nimbus-cloud nimbus-cloud--left">
        <span class="nimbus-lobe nimbus-lobe--1"></span>
        <span class="nimbus-lobe nimbus-lobe--2"></span>
        <span class="nimbus-lobe nimbus-lobe--3"></span>
        <span class="nimbus-lobe nimbus-lobe--4"></span>
      </div>

      <!-- Right Nimbus Formation -->
      <div class="nimbus-cloud nimbus-cloud--right">
        <span class="nimbus-lobe nimbus-lobe--1"></span>
        <span class="nimbus-lobe nimbus-lobe--2"></span>
        <span class="nimbus-lobe nimbus-lobe--3"></span>
        <span class="nimbus-lobe nimbus-lobe--4"></span>
        <span class="nimbus-lobe nimbus-lobe--5"></span>
      </div>

      <!-- High Atmospheric Cloud Shroud -->
      <div class="nimbus-cloud nimbus-cloud--top"></div>
    </div>

    <!-- Ocean Surface Layer -->
    <div class="ocean-layer">
      <div class="ocean-surface"></div>
      <div class="ocean-ripple-texture"></div>
      <div class="ocean-waves ocean-waves--back"></div>
      <div class="ocean-waves ocean-waves--mid"></div>
      <div class="ocean-waves ocean-waves--front"></div>
    </div>

    <!-- Horizon Mist & Atmospheric Fog -->
    <div class="horizon-mist"></div>

    <!-- Coastline, Grassy Knoll & Lighthouse Scene (Anchored to Bottom-Left) -->
    <div class="coast-scene">
      <svg class="lighthouse-svg" viewBox="0 0 800 650" preserveAspectRatio="xMinYMax meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Light Rock / Granite Gradient (Visible in Light & Dark Mode) -->
          <linearGradient id="rockGraniteGrad" x1="0%" y1="0%" x2="40%" y2="100%">
            <stop offset="0%" stop-color="#8a99a8" />
            <stop offset="30%" stop-color="#6c7c8c" />
            <stop offset="70%" stop-color="#4d5b6a" />
            <stop offset="100%" stop-color="#344150" />
          </linearGradient>

          <!-- Rock Shelf Top Highlight -->
          <linearGradient id="rockLedgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.95" />
            <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#64748b" stop-opacity="0.3" />
          </linearGradient>

          <!-- Coastal Grass / Knoll Gradient -->
          <linearGradient id="grassGrad" x1="0%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#709775" />
            <stop offset="35%" stop-color="#557c55" />
            <stop offset="70%" stop-color="#416d41" />
            <stop offset="100%" stop-color="#2d522d" />
          </linearGradient>

          <!-- Grassy Slope Highlight -->
          <linearGradient id="grassHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#a3c9a8" stop-opacity="0.9" />
            <stop offset="50%" stop-color="#7fa984" stop-opacity="0.75" />
            <stop offset="100%" stop-color="#4e7350" stop-opacity="0.2" />
          </linearGradient>

          <!-- Surf / Foam Gradient -->
          <linearGradient id="foamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
            <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#cbd5e0" stop-opacity="0.3" />
          </linearGradient>

          <!-- Lighthouse Tower Masonry Gradient -->
          <linearGradient id="towerWhiteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#f8fafc" />
            <stop offset="80%" stop-color="#e2e8f0" />
            <stop offset="100%" stop-color="#cbd5e0" />
          </linearGradient>

          <!-- Tower Red Band Gradient -->
          <linearGradient id="towerRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e03131" />
            <stop offset="50%" stop-color="#c92a2a" />
            <stop offset="85%" stop-color="#a61e1e" />
            <stop offset="100%" stop-color="#7a1414" />
          </linearGradient>

          <!-- Beacon Core Spherical Glow -->
          <radialGradient id="beaconCoreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="20%" stop-color="#fff8db" stop-opacity="0.95" />
            <stop offset="50%" stop-color="#f4b41a" stop-opacity="0.85" />
            <stop offset="80%" stop-color="#f4b41a" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#f4b41a" stop-opacity="0" />
          </radialGradient>

          <!-- Ambient Halo Glow -->
          <radialGradient id="beaconAmbientGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f4b41a" stop-opacity="0.45" />
            <stop offset="45%" stop-color="#f4b41a" stop-opacity="0.2" />
            <stop offset="80%" stop-color="#f4b41a" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#f4b41a" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Distant Low Reef / Rocks Outcropping in the Ocean -->
        <path d="M 0 495 Q 120 470 260 488 Q 400 505 540 520 Q 670 535 800 560 L 800 650 L 0 650 Z" fill="#3a4856" opacity="0.5" />
        <path d="M 120 482 Q 280 500 450 518 Q 620 538 780 560" fill="none" stroke="url(#foamGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />

        <!-- Main Promontory Body (Extending from Left Edge 0 to Right Edge 760) -->
        <path d="M 0 440 
                 C 80 410, 160 415, 230 425 
                 C 310 435, 380 415, 460 448 
                 C 540 480, 620 525, 710 580 
                 C 740 600, 770 625, 800 650 
                 L 0 650 Z" 
              fill="url(#rockGraniteGrad)" />

        <!-- Rock Formations, Strata, Ledges & Highlighted Crags -->
        <!-- Upper Rock Ledge Facets -->
        <polygon points="120,440 220,442 270,470 170,475" fill="#7d8c9d" opacity="0.8" />
        <polygon points="270,470 380,465 440,510 330,520" fill="#606f7e" opacity="0.75" />
        <polygon points="440,510 560,518 630,575 510,580" fill="#505f6e" opacity="0.8" />
        <polygon points="630,575 730,585 790,645 680,648" fill="#3e4c5a" opacity="0.85" />

        <!-- Sharp Rock Highlights on sunny edges -->
        <path d="M 0 445 Q 80 430 160 440 Q 240 450 310 445 Q 390 470 470 515 Q 560 565 670 615 Q 730 635 800 650" 
              fill="none" stroke="url(#rockLedgeHighlight)" stroke-width="4.5" stroke-linecap="round" />
        
        <path d="M 40 475 Q 140 460 220 480 Q 320 495 420 540 Q 520 595 620 645" 
              fill="none" stroke="url(#rockLedgeHighlight)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

        <path d="M 0 520 Q 90 505 180 525 Q 280 545 380 580 Q 480 630 550 650" 
              fill="none" stroke="#25303c" stroke-width="6" stroke-linecap="round" />
        
        <path d="M 110 545 Q 220 560 320 605 Q 410 640 460 650" 
              fill="none" stroke="#1e2732" stroke-width="4.5" stroke-linecap="round" />

        <!-- Coastal Grassy Knoll (Covering Left Flank and Crest) -->
        <!-- Grassy slope under cottage & lighthouse extending all the way to left screen edge -->
        <path d="M 0 395 
                 C 50 385, 110 390, 160 395 
                 C 210 400, 260 398, 320 412 
                 C 380 425, 430 435, 480 465 
                 C 450 475, 400 465, 340 448 
                 C 270 435, 200 428, 130 425 
                 C 70 422, 20 428, 0 435 Z" 
              fill="url(#grassGrad)" />

        <!-- Grassy Knoll Turf Highlights & Texture -->
        <path d="M 0 400 C 60 392, 130 396, 190 402 C 260 406, 330 420, 420 448 C 450 458, 470 468, 480 465" 
              fill="none" stroke="url(#grassHighlight)" stroke-width="4.5" stroke-linecap="round" />

        <!-- Grass tufts / vegetation along the knoll -->
        <path d="M 30 396 L 33 390 L 37 396 M 70 393 L 74 386 L 79 394 M 115 395 L 119 388 L 124 396 M 150 398 L 155 390 L 160 398 M 275 408 L 280 400 L 285 408 M 340 422 L 345 414 L 350 423 M 390 434 L 395 425 L 400 435" 
              stroke="#a3c9a8" stroke-width="2" stroke-linecap="round" />

        <!-- Crashing Ocean Surf & White Water Foam along Shoreline -->
        <path d="M 0 465 C 90 448 190 468 270 482 C 360 498 450 535 550 595 C 630 635 720 650 800 650" 
              fill="none" stroke="url(#foamGrad)" stroke-width="10" stroke-linecap="round" opacity="0.95" />
        <path d="M 20 482 C 110 470 210 490 300 508 C 390 530 480 575 580 635 C 620 650 670 650 700 650" 
              fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.88" />
        <path d="M 160 495 C 240 512 330 535 410 575 C 470 610 520 645 550 650" 
              fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

        <!-- Keeper's Cottage beside the Lighthouse -->
        <!-- Cottage Foundation on Grass -->
        <rect x="138" y="398" width="56" height="36" rx="3" fill="#f1f5f9" />
        <!-- Cottage Stone Base -->
        <rect x="136" y="430" width="60" height="6" rx="1" fill="#475569" />
        <!-- Cottage Red Pitched Roof -->
        <polygon points="130,398 166,368 202,398" fill="#a61e1e" />
        <polygon points="134,398 166,372 198,398" fill="#c92a2a" />
        <!-- Cottage Door -->
        <rect x="158" y="408" width="16" height="24" fill="#334155" rx="1.5" />
        <!-- Warm Glowing Window -->
        <rect x="144" y="404" width="9" height="12" rx="1" fill="#f4b41a" />
        <rect x="183" y="404" width="9" height="12" rx="1" fill="#f4b41a" />
        <line x1="148.5" y1="404" x2="148.5" y2="416" stroke="#7a1414" stroke-width="1" />
        <line x1="144" y1="410" x2="153" y2="410" stroke="#7a1414" stroke-width="1" />
        <!-- Cottage Chimney with Smoke Accent -->
        <rect x="184" y="370" width="8" height="16" fill="#7a1414" rx="1" />

        <!-- Lighthouse Structure -->
        <!-- Sturdy Stone Masonry Plinth / Foundation Base -->
        <polygon points="208,432 284,432 278,392 214,392" fill="#475569" />
        <polygon points="214,392 278,392 275,386 217,386" fill="#334155" />
        <rect x="214" y="386" width="64" height="6" rx="2" fill="#1e293b" />

        <!-- Lighthouse Tapered Tower -->
        <!-- Lower White Masonry Section -->
        <polygon points="218,386 274,386 267,290 225,290" fill="url(#towerWhiteGrad)" />
        <!-- Bold Red Middle Band -->
        <polygon points="225,290 267,290 261,215 231,215" fill="url(#towerRedGrad)" />
        <!-- Upper White Section -->
        <polygon points="231,215 261,215 257,185 235,185" fill="url(#towerWhiteGrad)" />

        <!-- Tower Windows -->
        <rect x="242" y="330" width="9" height="16" rx="2.5" fill="#1e293b" />
        <rect x="242" y="245" width="9" height="16" rx="2.5" fill="#1e293b" />

        <!-- Observation Gallery / Balcony Deck -->
        <rect x="228" y="180" width="36" height="6" rx="2" fill="#1e293b" />
        <!-- Gallery Railing -->
        <line x1="229" y1="174" x2="263" y2="174" stroke="#475569" stroke-width="2" />
        <line x1="232" y1="174" x2="232" y2="180" stroke="#475569" stroke-width="1.5" />
        <line x1="240" y1="174" x2="240" y2="180" stroke="#475569" stroke-width="1.5" />
        <line x1="252" y1="174" x2="252" y2="180" stroke="#475569" stroke-width="1.5" />
        <line x1="260" y1="174" x2="260" y2="180" stroke="#475569" stroke-width="1.5" />

        <!-- Glass Lantern Room -->
        <rect x="234" y="152" width="24" height="28" fill="#fffbe8" />
        <rect x="234" y="152" width="24" height="28" fill="none" stroke="#1e293b" stroke-width="3" />
        <line x1="246" y1="152" x2="246" y2="180" stroke="#1e293b" stroke-width="2" />

        <!-- Lantern Dome / Roof & Spire -->
        <path d="M 232 152 Q 246 128 260 152 Z" fill="#a61e1e" />
        <circle cx="246" cy="128" r="3.5" fill="#1e293b" />
        <line x1="246" y1="128" x2="246" y2="118" stroke="#1e293b" stroke-width="2" />

        <!-- Spherical Glowing Golden Beacon Light -->
        <!-- Ambient Halo -->
        <circle cx="246" cy="166" r="140" fill="url(#beaconAmbientGlow)" class="beacon-halo-pulse" />
        <!-- Radiant Inner Core Glow -->
        <circle cx="246" cy="166" r="46" fill="url(#beaconCoreGlow)" class="beacon-core-pulse" />
        <!-- White Hot Lamp Filament Bulb -->
        <circle cx="246" cy="166" r="8" fill="#ffffff" />
      </svg>
    </div>
  </div>

  <main class="app">
    <header class="app__header">
      <div class="brand">
        <img class="brand__mark" src="icon.svg" alt="Nimbus icon" width="56" height="56" />
        <div class="brand__text">
          <h1 class="app__title">Nimbus</h1>
          <p class="app__subtitle">Your day, clearly organized.</p>
        </div>
      </div>
      <div class="app__datetime" id="app-datetime">
        <div class="app__actions">
          <button type="button" class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">&#9881;&#65039;</button>
        </div>
        <div class="app__date" id="app-date"></div>
        <div class="app__time" id="app-time"></div>
      </div>
    </header>

    <!-- Empty canvas placeholder for agenda / tasks -->
    <div class="app__canvas" id="app-canvas">
      <div class="empty-state">
        <div class="empty-state__icon">✨</div>
        <h2 class="empty-state__title">Fresh canvas ready</h2>
        <p class="empty-state__desc">Ready to plan and build step by step.</p>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div class="modal" id="settings-modal" hidden>
    <div class="modal__backdrop" data-close-settings></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal__header">
        <h2 class="modal__title" id="settings-title">Settings</h2>
        <button type="button" class="modal__close" data-close-settings aria-label="Close dialog">&times;</button>
      </div>
      <div class="settings-content">
        <div class="settings-group">
          <div class="settings-row">
            <div>
              <div class="settings-row__label">Appearance</div>
              <div class="settings-row__desc">Switch between light sky and night sky</div>
            </div>
            <button type="button" class="btn btn--secondary" id="theme-toggle-btn">&#127769; Dark mode</button>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-group">
          <p class="settings-privacy">Data stays 100% in your browser (local-first localStorage).</p>
          <div class="settings-actions">
            <button type="button" class="btn btn--secondary" id="export-data-btn">Export data (JSON)</button>
            <button type="button" class="btn btn--secondary" id="import-data-btn">Import data (JSON)</button>
            <input type="file" id="import-file-input" accept="application/json" hidden />
            <button type="button" class="btn btn--danger" id="clear-data-btn">Clear all data</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
